<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>İletişim | Nostalji Erdek</title><meta name="description" content="Fotoğraf katkısı ve iletişim."><meta property="og:title" content="İletişim | Nostalji Erdek"><meta property="og:type" content="website"><link rel="icon" href="logo.webp"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Spectral:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body data-page="iletisim"><main><div class="page-h"><h1>İletişim ve fotoğraf katkısı</h1><p>Eski Erdek fotoğraflarınızı paylaşmak ya da bize ulaşmak için formu doldurun.</p></div>
<div class="narrow"><form class="panel" id="f"><label for="ad">Ad soyad</label><input id="ad" name="ad" maxlength="100" required autocomplete="name"><label for="eposta">E-posta</label><input id="eposta" name="eposta" type="email" maxlength="200" required autocomplete="email"><label for="mesaj">Mesajınız</label><textarea id="mesaj" name="mesaj" rows="5" maxlength="2000" required></textarea><button class="btn dark">Mesajı gönder</button><p class="msg" id="msg" role="status"></p></form></div></main>
<script type="module" src="common.js"></script>
<script type="module">
import{db}from"./firebase.js";
import{collection,addDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const f=document.getElementById("f"),m=document.getElementById("msg");
f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector("button");b.disabled=true;
try{await addDoc(collection(db,"mesajlar"),{ad:f.ad.value.trim(),eposta:f.eposta.value.trim(),mesaj:f.mesaj.value.trim(),timestamp:serverTimestamp()});f.reset();m.className="msg ok";m.textContent="Mesajınız bize ulaştı. Teşekkür ederiz."}
catch(x){m.className="msg err";m.textContent="Mesaj gönderilemedi. Lütfen birkaç dakika sonra tekrar deneyin."}finally{b.disabled=false}};
</script></body></html>
